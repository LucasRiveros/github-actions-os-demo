
name: Pruebas automatizadas

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ejecutar-pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Inspeccionar el entorno
        run: |
          uname -s
          node --version
          npm --version

      - name: Ejecutar pruebas
        run: npm test
